# One-time helper: downloads the official Credly badge images so the site
# can serve them locally instead of hotlinking. Safe to delete after use.
name: Fetch Credly badge images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download badge images from Credly
        run: |
          set -euo pipefail
          mkdir -p static/badges
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          fetch_badge() {
            name="$1"; id="$2"
            echo "== $name ($id)"
            html=$(curl -fsSL -A "$UA" "https://www.credly.com/badges/$id")
            title=$(printf '%s' "$html" | grep -o '<title>[^<]*' | head -1)
            echo "title: $title"
            og=$(printf '%s' "$html" | tr '>' '\n' | grep 'og:image' | grep -o 'https://images.credly.com[^"]*' | head -1)
            uuid=$(printf '%s' "$og" | grep -o 'images/[0-9a-f-]\{36\}' | head -1 | cut -d/ -f2)
            echo "template uuid: $uuid"
            embed=$(curl -fsSL -A "$UA" "https://www.credly.com/embedded_badge/$id" || true)
            api=$(curl -fsSL -A "$UA" "https://www.credly.com/api/v1/public_badges/$id" || true)
            echo "-- image URLs found across badge page, embed page, and API:"
            printf '%s\n%s\n%s' "$html" "$embed" "$api" | sed 's|\\/|/|g' \
              | grep -o 'https://images.credly.com[^"'"'"'&\\ ]*' | sort -u | tee /tmp/urls.txt || true
            best=$( (grep "$uuid" /tmp/urls.txt || true) | (grep -v -e thumb -e facebook || true) )
            sized=$(printf '%s' "$best" | sed 's|images.credly.com/images/|images.credly.com/size/340x340/images/|; s|/size/[0-9x]*/|/size/340x340/|')
            thumbs=$( (grep "$uuid" /tmp/urls.txt || true) )
            ok=""
            for url in $sized $best "https://images.credly.com/size/340x340/images/$uuid/image.png" $thumbs; do
              if curl -fsSL -A "$UA" -o "static/badges/$name.png" "$url"; then
                echo "downloaded: $url"; ok=1; break
              else
                echo "unavailable: $url"
              fi
            done
            [ -n "$ok" ] || { echo "ERROR: no image variant available for $name"; exit 1; }
            file "static/badges/$name.png"
            file "static/badges/$name.png" | grep -qi 'PNG image' || { echo "ERROR: $name is not a PNG"; exit 1; }
          }
          echo "===== profile badge list"
          profile=$(curl -fsSL -A "$UA" "https://www.credly.com/users/jforman/badges.json" || true)
          if printf '%s' "$profile" | jq -e '.data' >/dev/null 2>&1; then
            printf '%s' "$profile" | jq -r '.data[] | [.id, (.badge_template.name // "?")] | @tsv'
            ansible_rhce=$(printf '%s' "$profile" | jq -r '.data[] | select(.badge_template.name | test("Engineer in Ansible|Ansible Automation")) | .id' | head -1)
            ansible_adv=$(printf '%s' "$profile" | jq -r '.data[] | select(.badge_template.name | test("Advanced.*Ansible|Ansible.*Advanced")) | .id' | head -1)
            echo "ansible rhce badge id: $ansible_rhce"
            echo "ansible advanced badge id: $ansible_adv"
            [ -n "$ansible_rhce" ] && fetch_badge ansible "$ansible_rhce"
            [ -n "$ansible_adv" ] && fetch_badge advansible "$ansible_adv"
          else
            echo "profile JSON unavailable; response head:"
            printf '%s' "$profile" | head -c 500
          fi
          fetch_badge rhcsa    d0f8358e-c90b-48b4-a07c-50c3ff8acb03
          fetch_badge rhce     4b263b5a-d915-4e40-8b89-5a761ccdc5fe
          fetch_badge rhosvirt 3313a051-f166-4c48-84d3-2f35e83e3b36
          ls -la static/badges/

      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/badges
          git commit -m "Add self-hosted Credly badge images"
          git push
